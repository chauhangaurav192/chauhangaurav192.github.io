<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaurav Chauhan | DevOps Portfolio</title>

<style>
/* ===== RESET ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: #fdf6ec;
  color: #3b2f2f;
  scroll-behavior: smooth;
}

/* ===== HEADER ===== */
header {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #f6e7d8, #e4c5a2);
  animation: fadeIn 1.5s ease;
}

.header-content {
  text-align: center;
}

.profile-img {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  border: 5px solid #6b4f4f;
  margin-bottom: 20px;
  animation: float 3s ease-in-out infinite;
}

header h1 {
  font-size: 48px;
}

header h1 span {
  color: #6b4f4f;
}

header p {
  font-size: 20px;
  margin: 10px 0 25px;
}

.btn {
  display: inline-block;
  padding: 12px 30px;
  background: #6b4f4f;
  color: white;
  text-decoration: none;
  border-radius: 30px;
  transition: 0.3s;
}

.btn:hover {
  background: #4e3838;
}

/* ===== SKILLS ===== */
.skills {
  padding: 80px 10%;
  background: #fff7ec;
}

.skills h2 {
  text-align: center;
  font-size: 36px;
  margin-bottom: 50px;
}

.skill {
  margin-bottom: 25px;
}

.skill span {
  font-weight: bold;
}

.progress {
  background: #e6d3b1;
  border-radius: 30px;
  overflow: hidden;
  margin-top: 8px;
}

.progress-bar {
  height: 12px;
  width: 0;
  background: #6b4f4f;
  border-radius: 30px;
  animation: load 2s forwards;
}

/* ===== FOOTER ===== */
footer {
  background: #6b4f4f;
  color: white;
  text-align: center;
  padding: 20px;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(30px);}
  to {opacity: 1; transform: translateY(0);}
}

@keyframes float {
  0%, 100% {transform: translateY(0);}
  50% {transform: translateY(-10px);}
}

@keyframes load {
  from {width: 0;}
  to {width: var(--level);}
}
</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header>
  <div class="header-content">
    <img src="profile.jpg" alt="Gaurav Chauhan" class="profile-img">
    <h1>Gaurav <span>Chauhan</span></h1>
    <p>Cloud & DevOps Engineer</p>
    <a href="#" class="btn">Download CV (Coming Soon)</a>
  </div>
</header>

<!-- ===== SKILLS ===== -->
<section class="skills">
  <h2>Skills & Experience</h2>

  <div class="skill">
    <span>Linux</span>
    <div class="progress">
      <div class="progress-bar" style="--level:90%"></div>
    </div>
  </div>

  <div class="skill">
    <span>Docker</span>
    <div class="progress">
      <div class="progress-bar" style="--level:85%"></div>
    </div>
  </div>

  <div class="skill">
    <span>AWS</span>
    <div class="progress">
      <div class="progress-bar" style="--level:80%"></div>
    </div>
  </div>

  <div class="skill">
    <span>CI/CD</span>
    <div class="progress">
      <div class="progress-bar" style="--level:75%"></div>
    </div>
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer>
  © 2025 Gaurav Chauhan | DevOps Portfolio
</footer>

</body>
</html>
