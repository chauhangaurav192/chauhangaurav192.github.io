<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gaurav Chauhan | DevOps Portfolio</title>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background:#fff7ec;
}

/* HERO */
.hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:80px;
}
.hero-left h1{
  font-size:48px;
  margin:10px 0;
}
.hero-left span{
  color:#7b4a3f;
}
.type{
  font-size:22px;
  color:#7b4a3f;
  height:30px;
}
.btn{
  margin-top:20px;
  padding:12px 24px;
  background:#7b4a3f;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:not-allowed;
}

/* CARTOON */
.hero-right img{
  width:360px;
  animation: float 3s ease-in-out infinite;
}
@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-12px);}
  100%{transform:translateY(0);}
}

/* SECTION */
.section{
  background:#7b4a3f;
  color:#fff;
  padding:60px;
}
.card{
  background:#fff3dd;
  color:#000;
  border-radius:14px;
  padding:30px;
}

/* SKILLS */
.skill{
  margin:15px 0;
}
.bar{
  background:#ddd;
  height:10px;
  border-radius:20px;
}
.fill{
  height:10px;
  background:#7b4a3f;
  border-radius:20px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-left">
    👋 I'm
    <h1>Gaurav <span>Chauhan</span></h1>
    <div class="type" id="typing"></div>
    <button class="btn">Download CV (Coming Soon)</button>
  </div>

  <div class="hero-right">
    <!-- BOY CARTOON -->
    <img src="https://i.imgur.com/9QZ7YzG.png" alt="Developer">
  </div>
</div>

<!-- SKILLS -->
<div class="section">
  <div class="card">
    <h2>Skills & Experience</h2>

    <div class="skill">Linux
      <div class="bar"><div class="fill" style="width:95%"></div></div>
    </div>

    <div class="skill">Docker
      <div class="bar"><div class="fill" style="width:90%"></div></div>
    </div>

    <div class="skill">AWS
      <div class="bar"><div class="fill" style="width:85%"></div></div>
    </div>

    <div class="skill">CI/CD
      <div class="bar"><div class="fill" style="width:80%"></div></div>
    </div>
  </div>
</div>

<footer>
© 2025 Gaurav Chauhan | DevOps Portfolio
</footer>

<!-- TYPING ANIMATION -->
<script>
const text = ["DevOps Engineer", "Cloud | AWS", "Docker | CI/CD"];
let i=0,j=0,del=false;
function type(){
  document.getElementById("typing").innerHTML =
  text[i].substring(0,j);
  if(!del && j++ === text[i].length+1) del=true;
  if(del && j-- === 0){ del=false; i=(i+1)%text.length; }
  setTimeout(type,120);
}
type();
</script>

</body>
</html>
